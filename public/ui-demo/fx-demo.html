<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>塊頭勇者．強化/進化演出 Demo</title>
<style>
@font-face { font-family:'GenSen'; font-weight:400; src:url('assets/fonts/gensen-r.woff2') format('woff2'); font-display:swap; }
@font-face { font-family:'GenSen'; font-weight:700; src:url('assets/fonts/gensen-b.woff2') format('woff2'); font-display:swap; }
:root{
  --gold:#f4b73c; --goldHi:#ffe27a; --goldLo:#c8912a;
  --fire:#e8513a; --ink:#2b333a;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overflow:hidden; }
body{
  font-family:'GenSen','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:18px; color:#eef0f3; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  background:radial-gradient(ellipse 100% 70% at 50% 40%, #5e5954 0%, #383030 52%, #261e1a 100%);
}
button{ font-family:inherit; }

/* ===== 手機外框 ===== */
.phone{ position:relative; width:min(100vw,430px); height:100svh; margin:0 auto; display:flex; flex-direction:column; }
.topbtns{ display:flex; gap:10px; padding:12px 12px 6px; flex:none; }
.bigbtn{
  flex:1; height:60px; border-radius:18px; border:3px solid var(--goldLo);
  background:linear-gradient(180deg,#ffd45c,#f4a62c); color:#4a2c00; font-size:22px; font-weight:700;
  box-shadow:0 4px 0 #a86f12, 0 8px 18px rgba(0,0,0,.35); cursor:pointer;
}
.bigbtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #a86f12; }
.bigbtn.evob{ background:linear-gradient(180deg,#ffb27a,#ec5a35); border-color:#a8321a; color:#fff; box-shadow:0 4px 0 #8d2410, 0 8px 18px rgba(0,0,0,.35); text-shadow:0 2px 0 rgba(0,0,0,.25); }
.bigbtn:disabled{ opacity:.5; }
.subrow{ display:flex; align-items:center; justify-content:space-between; padding:0 16px 4px; font-size:16px; color:#b9b2aa; flex:none; min-height:28px; }
.subrow .speed{ border:2px solid #6f665e; background:transparent; color:#d8d0c8; border-radius:14px; font-size:16px; padding:2px 12px; cursor:pointer; }
.subrow .speed.on{ background:#6f665e; color:#fff; }

/* ===== 強化場景 ===== */
.scene{ position:relative; flex:1; min-height:0; overflow:hidden; }
.fxlayer{ position:absolute; inset:0; pointer-events:none; z-index:20; overflow:visible; }
.hint{ position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:18px; color:#e8dccb; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; }
.hint.on{ opacity:.85; }

.card{
  position:absolute; left:50%; top:10px; width:min(76vw,300px); margin-left:calc(min(76vw,300px) / -2);
  border-radius:24px; border:5px solid var(--gold); padding:10px 10px 12px;
  background:linear-gradient(165deg,#ff9a7a 0%,#e8513a 62%,#c63a22 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.35);
  will-change:transform;
}
.card .portrait{
  position:relative; height:min(46vw,176px); border-radius:16px; overflow:hidden;
  background:radial-gradient(circle at 50% 45%, #fff1e6 0%, #ffcdb7 60%, #f6a98a 100%);
  border:2px solid rgba(255,255,255,.7);
}
.card .portrait img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.card .el{ position:absolute; left:8px; top:8px; width:34px; height:34px; border-radius:50%; background:var(--fire); color:#fff; font-weight:700; font-size:20px; display:grid; place-items:center; border:2px solid #fff; box-shadow:0 2px 4px rgba(0,0,0,.3); z-index:2; }
.stars{ color:var(--goldHi); font-size:26px; letter-spacing:2px; -webkit-text-stroke:1.5px #a8680a; text-shadow:0 2px 0 #a8680a; line-height:1; }
.card .stars{ position:absolute; right:8px; bottom:6px; z-index:2; font-size:24px; }
.card .nmrow{ display:flex; align-items:baseline; justify-content:space-between; margin:10px 4px 0; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.25); }
.card .nm{ font-size:24px; font-weight:700; }
.card .lvwrap{ display:flex; align-items:center; gap:8px; }
.card .lv{ font-size:32px; font-weight:700; display:inline-block; }
.maxbadge{
  display:none; font-size:22px; font-weight:700; padding:0 10px; border-radius:12px; color:#5a3400;
  background:linear-gradient(180deg,#fff2a8,#f4b73c); border:2px solid #fff; box-shadow:0 0 14px #ffd45c; text-shadow:none;
}
.maxbadge.on{ display:inline-block; }
.expbar{ position:relative; height:20px; margin:6px 4px 0; border-radius:10px; background:rgba(60,10,0,.45); overflow:hidden; border:2px solid rgba(255,255,255,.5); }
.expbar i{ position:absolute; left:0; top:0; bottom:0; width:62%; background:linear-gradient(180deg,#9df0b2,#35a866); border-radius:8px; }
.expbar.gold i{ background:linear-gradient(180deg,#fff2a8,#f4b73c); box-shadow:0 0 12px #ffd45c; }
.exptxt{ margin:3px 6px 0; display:flex; justify-content:space-between; font-size:16px; color:#ffe9de; }

/* 三圍 */
.stats{
  position:absolute; left:50%; width:min(76vw,300px); margin-left:calc(min(76vw,300px) / -2);
  display:flex; gap:8px;
}
.stat{ flex:1; border-radius:14px; background:rgba(20,14,12,.55); border:2px solid #77695d; padding:6px 4px 8px; text-align:center; }
.stat small{ display:block; font-size:16px; color:#cbbfb3; }
.stat b{ display:block; font-size:30px; line-height:1.15; color:#fff; font-variant-numeric:tabular-nums; }
.stat.main b{ font-size:34px; }
.stat b.gold{ color:var(--goldHi); text-shadow:0 0 12px #f4b73c; }
.stat b.pop{ display:block; }

/* 素材 */
.mats{ position:absolute; left:0; right:0; display:flex; justify-content:center; gap:16px; }
.slot{ width:86px; height:86px; border-radius:18px; border:3px dashed #8a7d70; background:rgba(0,0,0,.22); position:relative; }
.slot .mat{ position:absolute; inset:-3px; width:calc(100% + 6px); height:calc(100% + 6px); border-radius:18px; border:3px solid #fff; object-fit:cover; box-shadow:0 4px 10px rgba(0,0,0,.45); }
.slot .mat.fireb{ border-color:var(--fire); }
.slot .tag{ position:absolute; left:50%; bottom:-24px; transform:translateX(-50%); font-size:16px; white-space:nowrap; color:#cbbfb3; }
.flyer{ position:fixed; left:0; top:0; width:86px; height:86px; border-radius:18px; border:3px solid #fff; object-fit:cover; z-index:45; pointer-events:none; will-change:transform; box-shadow:0 4px 10px rgba(0,0,0,.45); }

/* 大字 */
.lvup{
  position:absolute; left:0; right:0; text-align:center; font-size:76px; font-weight:700; letter-spacing:2px;
  color:#ffd84a; -webkit-text-stroke:7px #7a3d00; paint-order:stroke fill; text-shadow:0 6px 0 #7a3d00, 0 0 28px rgba(255,200,60,.9);
  opacity:0; z-index:25; pointer-events:none; white-space:nowrap;
}
.lvup small{ font-size:40px; -webkit-text-stroke:5px #7a3d00; }

/* 圓環 */
.ring{ position:absolute; border-radius:50%; pointer-events:none; }

/* ===== 進化圖層 ===== */
.evo{ position:fixed; inset:0; z-index:40; display:none; overflow:hidden; }
.evo.on{ display:block; }
.evo .dim{ position:absolute; inset:0; background:rgba(5,4,12,.97); opacity:0; }
.evo .shake{ position:absolute; left:50%; top:0; bottom:0; width:min(100vw,430px); transform:translateX(-50%); }
.evo .shakein{ position:absolute; inset:0; }
.evo .glow{ position:absolute; left:50%; top:36%; width:560px; height:560px; margin:-280px 0 0 -280px; border-radius:50%; background:radial-gradient(circle,rgba(255,170,60,.95) 0%,rgba(255,110,30,.5) 32%,rgba(255,80,20,0) 68%); opacity:0; transform:scale(.4); }
.evo .etitle{ position:absolute; left:0; right:0; top:3.5%; text-align:center; font-size:84px; font-weight:700; color:#ffd84a; -webkit-text-stroke:8px #7a2a00; paint-order:stroke fill; text-shadow:0 7px 0 #7a2a00, 0 0 34px rgba(255,170,40,.95); opacity:0; white-space:nowrap; }
.evo .ecard{ position:absolute; left:50%; top:36%; width:min(70vw,290px); margin-left:calc(min(70vw,290px) / -2); transform:translateY(-50%); transform-origin:50% 50%; }
.evo .ecard .inner{
  border-radius:26px; border:6px solid var(--gold); padding:12px;
  background:linear-gradient(165deg,#ff9a7a 0%,#e8513a 62%,#c63a22 100%); box-shadow:0 12px 40px rgba(0,0,0,.6);
}
.evo .ecard .portrait{ position:relative; height:min(46vw,188px); border-radius:18px; overflow:hidden; background:radial-gradient(circle at 50% 45%,#fff1e6 0%,#ffcdb7 60%,#f6a98a 100%); border:2px solid rgba(255,255,255,.7); }
.evo .ecard .portrait img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.evo .ecard .nm{ margin-top:8px; text-align:center; font-size:28px; font-weight:700; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.25); }
.evo .estars{ position:absolute; left:0; right:0; top:calc(36% + 168px); text-align:center; font-size:60px; line-height:1; white-space:nowrap; }
.evo .estars span{ display:inline-block; color:#5a4e44; -webkit-text-stroke:2px #2e2620; margin:0 3px; opacity:0; }
.evo .estars span.lit{ color:var(--goldHi); -webkit-text-stroke:3px #a8680a; text-shadow:0 0 18px #ffc83a; }
.evo .estat{
  position:absolute; left:50%; width:min(88vw,380px); margin-left:calc(min(88vw,380px) / -2); top:calc(36% + 168px + 76px);
  border-radius:20px; background:rgba(30,22,18,.85); border:3px solid var(--gold); padding:10px 14px; opacity:0;
}
.evo .estat .row{ display:flex; align-items:center; justify-content:space-between; font-size:24px; padding:3px 0; }
.evo .estat .row span:first-child{ color:#d9ccbd; }
.evo .estat .row b{ font-variant-numeric:tabular-nums; color:#fff; font-size:28px; }
.evo .estat .row b i{ font-style:normal; color:#8d8174; margin:0 8px; }
.evo .estat .row.m b{ font-size:34px; }
.evo .estat .row b em{ font-style:normal; color:var(--goldHi); text-shadow:0 0 10px #f4b73c; }
.evo .estat .row b.new{ color:var(--goldHi); }
.evo .fire{ position:absolute; left:50%; top:36%; width:116px; height:116px; margin:-58px 0 0 -58px; border-radius:22px; border:4px solid #fff; object-fit:cover; opacity:0; z-index:5; box-shadow:0 0 30px #ff7a2a; }
.evo .white{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:8; }
.evo .done{
  position:absolute; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); width:min(70vw,300px); margin-left:calc(min(70vw,300px) / -2); height:68px;
  border-radius:22px; border:3px solid var(--goldLo); background:linear-gradient(180deg,#ffd45c,#f4a62c); color:#4a2c00; font-size:30px; font-weight:700;
  box-shadow:0 5px 0 #a86f12, 0 10px 24px rgba(0,0,0,.5); opacity:0; pointer-events:none; cursor:pointer; z-index:9;
}
.evo .done.on{ pointer-events:auto; }
.pc{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60; }
@media (max-height:700px){
  .evo .etitle{ font-size:68px; }
  .evo .estars{ font-size:48px; }
  .evo .estat .row{ font-size:20px; padding:1px 0; } .evo .estat .row b{ font-size:24px; } .evo .estat .row.m b{ font-size:28px; }
  .evo .estat{ padding:6px 12px; top:calc(36% + 168px + 58px); }
  .evo .estat .row:nth-child(n+3){ display:none; }
}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="topbtns">
    <button class="bigbtn" id="btnFuse">▶ 強化演出</button>
    <button class="bigbtn evob" id="btnEvo">▶ 進化演出</button>
  </div>
  <div class="subrow"><span id="status">點上面按鈕看演出</span><button class="speed" id="btnSpeed">慢動作 ×0.5</button></div>

  <div class="scene" id="scene">
    <!-- 目標卡 -->
    <div class="card" id="card">
      <div class="portrait">
        <div class="el">火</div>
        <img src="art/c03_full.webp" alt="">
        <div class="stars">★★</div>
      </div>
      <div class="nmrow">
        <span class="nm">焰焰</span>
        <span class="lvwrap"><span class="maxbadge" id="maxb">MAX</span><span class="lv" id="lv">Lv.37</span></span>
      </div>
      <div class="expbar" id="expbar"><i id="expfill"></i></div>
      <div class="exptxt"><span>EXP</span><span id="exptxt">620 / 1000</span></div>
    </div>
    <div class="stats" id="stats">
      <div class="stat main"><small>攻擊</small><b id="stA">539</b></div>
      <div class="stat"><small>血量</small><b id="stH">1240</b></div>
      <div class="stat"><small>回復</small><b id="stR">112</b></div>
    </div>
    <div class="mats" id="mats">
      <div class="slot"><img class="mat fireb" src="art/c61_thumb.webp" alt=""><span class="tag">同屬</span></div>
      <div class="slot"><img class="mat" src="art/c71_thumb.webp" alt=""><span class="tag">異屬</span></div>
      <div class="slot"><img class="mat fireb" src="art/c61_thumb.webp" alt=""><span class="tag">同屬</span></div>
    </div>
    <div class="lvup" id="lvup">LV UP!</div>
    <div class="fxlayer" id="fxl"></div>
    <div class="hint" id="hint">點畫面任意處可跳過</div>
  </div>
</div>

<!-- 進化圖層 -->
<div class="evo" id="evo">
  <div class="dim" id="eDim"></div>
  <div class="shake" id="eShake"><div class="shakein" id="eShakeIn">
    <div class="glow" id="eGlow"></div>
    <div class="etitle" id="eTitle">進化！</div>
    <div class="ecard" id="eCard"><div class="inner">
      <div class="portrait"><img id="eImg" src="art/c03_full.webp" alt=""></div>
      <div class="nm">焰焰</div>
    </div></div>
    <img class="fire" id="eFire" src="art/c61_thumb.webp" alt="">
    <div class="estars" id="eStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="estat" id="eStat">
      <div class="row"><span>星級</span><b><span>2★</span><i>→</i><em>3★</em></b></div>
      <div class="row m"><span>攻擊</span><b><span id="eA0">539</span><i>→</i><em id="eA1">539</em></b></div>
      <div class="row"><span>血量</span><b><span>1240</span><i>→</i><em id="eH1">1240</em></b></div>
      <div class="row"><span>回復</span><b><span>112</span><i>→</i><em id="eR1">112</em></b></div>
    </div>
    <div class="white" id="eWhite"></div>
    <button class="done" id="eDone">完成</button>
  </div></div>
</div>
<canvas class="pc" id="pc"></canvas>

<script>
'use strict';
/* =====================================================================
   塊頭勇者 強化/進化演出 Demo —— 時序即分鏡（移植 Phaser 時照 TL_* 表的毫秒數搬）
   結構：clock(可變速) + sched(at / tween) + particles(canvas) + WAAPI(彈跳)
   ===================================================================== */
const $ = id => document.getElementById(id);
const ease = {
  out:  t => 1 - Math.pow(1 - t, 3),
  in:   t => t * t * t,
  in2:  t => t * t,
  io:   t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
  back: t => { const c = 1.9; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); },
};
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

/* ---------- 時鐘 / 排程 ---------- */
let speed = 1, clock = 0, last = performance.now();
const items = [];                       // {t0,dur,fn,group,started}
function at(group, t, fn)            { items.push({ group, t0: clock + t / 1, dur: 0, fn, started: false }); }
function tween(group, t, dur, fn, e) { items.push({ group, t0: clock + t, dur, fn, e: e || (x=>x), started: false }); }
function cancelGroup(g) { for (let i = items.length - 1; i >= 0; i--) if (items[i].group === g) items.splice(i, 1); }
function stepSched() {
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (clock < it.t0) continue;
    if (it.dur === 0) { items.splice(i--, 1); it.fn(); continue; }
    const p = Math.min(1, (clock - it.t0) / it.dur);
    it.fn(it.e(p), p);
    if (p >= 1) items.splice(i--, 1);
  }
}
/* WAAPI 包裝（吃 speed） */
function anim(el, kf, dur, opt) { return el.animate(kf, Object.assign({ duration: dur / speed, easing: 'ease-out' }, opt || {})); }
const sleepTimers = [];

/* ---------- 粒子 ---------- */
const cv = $('pc'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
resize(); addEventListener('resize', resize);
const P = [];
function spawn(o) {
  P.push(Object.assign({ x:0, y:0, vx:0, vy:0, g:0, drag:1, life:600, age:0, size:5, color:'#ffb347',
    shape:'dot', rot:0, vr:0, shrink:true, conv:null, delay:0 }, o));
}
function stepP(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.age += dt;
    if (p.age >= p.life) { P.splice(i, 1); continue; }
    if (p.conv) {
      const k = ease.in2(p.age / p.life), c = p.conv;
      const nx = c.sx + (c.tx - c.sx) * k, ny = c.sy + (c.ty - c.sy) * k;
      p.vx = (nx - p.x) / Math.max(dt, 1) * 1000; p.vy = (ny - p.y) / Math.max(dt, 1) * 1000; p.x = nx; p.y = ny;
    } else {
      const s = dt / 1000;
      p.vx *= Math.pow(p.drag, dt / 16.7); p.vy *= Math.pow(p.drag, dt / 16.7);
      p.vy += p.g * s; p.x += p.vx * s; p.y += p.vy * s; p.rot += p.vr * s;
    }
  }
}
function sparkle(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = rot + i * Math.PI / 2, a2 = a + Math.PI / 4;
    c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    c.lineTo(x + Math.cos(a2) * r * .28, y + Math.sin(a2) * r * .28);
  }
  c.closePath(); c.fill();
}
function drawP() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!P.length) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of P) {
    if (p.delay > 0) continue;
    const k = p.age / p.life;
    const a = p.conv ? Math.min(1, k * 3) * (1 - k * .3) : (k < .1 ? k / .1 : 1) * (1 - k);
    const sz = p.size * (p.shrink ? (1 - .6 * k) : 1);
    ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = ctx.strokeStyle = p.color;
    if (p.shape === 'dot') {
      ctx.beginPath(); ctx.arc(p.x, p.y, sz, 0, 6.283); ctx.fill();
      ctx.globalAlpha = Math.max(0, a) * .28; ctx.beginPath(); ctx.arc(p.x, p.y, sz * 2.3, 0, 6.283); ctx.fill();
    } else if (p.shape === 'streak') {           // 沿速度方向的線形火花
      const sp = Math.hypot(p.vx, p.vy) || 1, L = Math.min(46, 6 + sp * .045);
      ctx.lineWidth = Math.max(1.2, sz * .6); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx / sp * L, p.y - p.vy / sp * L); ctx.stroke();
    } else if (p.shape === 'star') {
      sparkle(ctx, p.x, p.y, sz * 1.6, p.rot);
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function burst(x, y, n, o) {
  o = o || {};
  const cols = o.colors || ['#ffffff', '#ffe27a', '#ffb347', '#ff7a2a'];
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.283), sp = rnd(o.smin || 180, o.smax || 520);
    spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: o.drag || .93, g: o.g || 0, life: rnd(o.lmin || 400, o.lmax || 800),
      size: rnd(2.5, 5.5), color: pick(cols), shape: o.shape || (Math.random() < .55 ? 'streak' : 'dot'), rot: rnd(0, 6), vr: rnd(-6, 6) });
  }
}
function starBurst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.283), sp = rnd(120, 420);
    spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, g: 260, drag: .95, life: rnd(700, 1200), size: rnd(5, 9),
      color: pick(['#fff2a8', '#ffd45c', '#ffffff']), shape: 'star', rot: rnd(0, 3), vr: rnd(-5, 5), shrink: true });
  }
}
function loop(now) {
  const dt = Math.min(50, now - last) * speed; last = now;
  clock += dt; stepSched(); stepP(dt); drawP();
  requestAnimationFrame(loop);
}
requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });

const center = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; };
const fmt = n => Math.round(n).toLocaleString('en-US').replace(/,/g, '');
function roll(group, t, dur, from, to, setter, e) {
  tween(group, t, dur, p => setter(from + (to - from) * p), e || ease.out);
}

function ring(x, y, color, from, to, dur, w, host) {      // 圓環擴散（x,y 為 viewport 座標）
  host = host || $('fxl');
  const sr = host.getBoundingClientRect();
  const d = document.createElement('div'); d.className = 'ring';
  d.style.cssText = `left:${x - sr.left - from / 2}px;top:${y - sr.top - from / 2}px;width:${from}px;height:${from}px;border:${w || 6}px solid ${color};box-shadow:0 0 18px ${color}`;
  host.appendChild(d);
  const a = anim(d, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(' + (to / from) + ')', opacity: 0 }], dur);
  a.onfinish = () => d.remove();
}
function cardHit(isFire) {
  anim(card, [{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], 200);
  const c = center(card);
  // 白閃：卡片上疊白色漸隱 + 一圈白環
  const fl = document.createElement('div');
  const sr = scene.getBoundingClientRect(), r = c.r;
  fl.className = 'ring';
  fl.style.cssText = `left:${r.left - sr.left}px;top:${r.top - sr.top}px;width:${r.width}px;height:${r.height}px;border-radius:24px;background:#fff`;
  $('fxl').appendChild(fl);
  anim(fl, [{ opacity: .85 }, { opacity: 0 }], 240).onfinish = () => fl.remove();
  ring(c.x, c.y, '#ffffff', r.width * .7, r.width * 1.25, 320, 5);
  burst(c.x, c.y, 14, { colors: isFire ? ['#ffffff', '#ffd45c', '#ff8a2a'] : ['#ffffff', '#d9e6f2', '#9fc4e8'], smin: 150, smax: 380, lmin: 250, lmax: 480 });
}
function launch(i) {
  const slot = document.querySelectorAll('.slot')[i], mat = slot.querySelector('.mat');
  const isFire = mat.classList.contains('fireb');
  const s = center(mat), t = center(card);
  const fl = document.createElement('img'); fl.className = 'flyer'; fl.src = mat.src; fl.style.borderColor = isFire ? '#e8513a' : '#fff';
  document.body.appendChild(fl); mat.style.visibility = 'hidden';
  const cx = (s.x + t.x) / 2 + (i === 0 ? -90 : i === 2 ? 90 : 0), cy = (s.y + t.y) / 2 + 40;   // 貝茲控制點：弧形
  let tp = 0;
  tween(FX, 0, TL_FUSE.flyDur, (p) => {
    const k = ease.in2(p), u = 1 - k;
    const x = u * u * s.x + 2 * u * k * cx + k * k * t.x, y = u * u * s.y + 2 * u * k * cy + k * k * t.y;
    const sc = 1 - .65 * k;
    fl.style.transform = `translate(${x - 43}px,${y - 43}px) scale(${sc}) rotate(${k * 200}deg)`;
    if (isFire) {                                   // 同屬：火色粒子尾跡
      for (let n = 0; n < 2; n++) spawn({ x: x + rnd(-8, 8), y: y + rnd(-8, 8), vx: rnd(-40, 40), vy: rnd(-40, 40) - 30,
        life: rnd(260, 420), size: rnd(4, 8), color: pick(['#ff4d1a', '#ff8c1a', '#ffd23a']), shape: 'dot', g: -60 });
    }
  }, x => x);
  at(FX, TL_FUSE.flyDur, () => { fl.remove(); cardHit(isFire); });
}
function lvUpFx(label, big) {
  const el = $('lvup'), c = center(card);
  el.innerHTML = label;
  anim(el, [
    { opacity: 0, transform: 'scale(.3)', offset: 0 },
    { opacity: 1, transform: 'scale(' + (big ? 1.35 : 1.2) + ')', offset: .28 },
    { opacity: 1, transform: 'scale(1)', offset: .42 },
    { opacity: 1, transform: 'translateY(-4px) scale(1)', offset: .8 },
    { opacity: 0, transform: 'translateY(-34px) scale(1)', offset: 1 },
  ], big ? 700 : 480, { easing: 'ease-out' });
  // 金光環一圈 + 向上飄的金粒子
  ring(c.x, c.y, '#ffd45c', c.r.width * .8, c.r.width * 1.7, 520, 8);
  ring(c.x, c.y, '#fff2a8', c.r.width * .6, c.r.width * 1.3, 420, 4);
  for (let i = 0; i < 26; i++) spawn({ x: c.x + rnd(-c.r.width / 2, c.r.width / 2), y: c.y + rnd(0, c.r.height / 2), vx: rnd(-40, 40), vy: rnd(-380, -160),
    drag: .96, life: rnd(500, 900), size: rnd(3, 6), color: pick(['#fff2a8', '#ffd45c', '#ffb347']), shape: Math.random() < .4 ? 'star' : 'dot', rot: rnd(0, 3), vr: rnd(-4, 4) });
}
function playFuse() {
  fuseReset(); layoutScene();
  fuse.playing = true; $('status').textContent = '強化演出中…（點畫面可跳過）'; $('hint').classList.add('on');
  const T = TL_FUSE;
  // 1) 素材依序（80ms 間隔）飛入
  T.fly.forEach((t, i) => at(FX, t, () => launch(i)));
  // 2) 經驗條 62→100，LV UP #1
  tween(FX, T.expRoll1, T.expRoll1Dur, p => setExp(62 + 38 * p), ease.io);
  at(FX, T.lvUp1, () => { $('lv').textContent = 'Lv.38'; bump($('lv')); lvUpFx('LV UP!', false); });
  // 3) 快播連跳：條歸零→0→100，LV UP #2（到頂）
  at(FX, T.expRoll2 - 1, () => setExp(0));
  tween(FX, T.expRoll2, T.expRoll2Dur, p => setExp(100 * p), ease.in2);
  at(FX, T.lvUp2, () => { $('lv').textContent = 'Lv.39'; bump($('lv'), 1.5); lvUpFx('LV UP!<small> ×2</small>', true); });
  // 4) 三圍滾動（攻 539→618）
  const A = [539, 618], Hh = [1240, 1425], R = [112, 129];
  tween(FX, T.statRoll, T.statRollDur, p => {
    setStats(A[0] + (A[1] - A[0]) * p, Hh[0] + (Hh[1] - Hh[0]) * p, R[0] + (R[1] - R[0]) * p);
  }, ease.out);
  at(FX, T.statRoll, () => ['stA', 'stH', 'stR'].forEach(i => $(i).classList.add('gold')));
  at(FX, T.statRoll + T.statRollDur - 40, () => ['stA', 'stH', 'stR'].forEach(i => bump($(i), 1.18)));
  // 5) 到頂 MAX
  at(FX, T.maxPop, () => {
    const mb = $('maxb'); mb.classList.add('on'); $('expbar').classList.add('gold');
    anim(mb, [{ transform: 'scale(2.6) rotate(-14deg)', opacity: 0 }, { transform: 'scale(.9) rotate(4deg)', opacity: 1, offset: .6 }, { transform: 'scale(1) rotate(0)', opacity: 1 }], 380, { easing: 'cubic-bezier(.2,1.4,.4,1)' });
    const c = center(mb); starBurst(c.x, c.y, 34); ring(c.x, c.y, '#fff2a8', 40, 190, 500, 4);
  });
  at(FX, T.end, () => { fuseFinalState(); });
}

function playEvo() {

  $('btnFuse').disabled = $('btnEvo').disabled = true; $('status').textContent = '進化演出中…';
  $('evo').classList.add('on');
  const T = TL_EVO;

  tween(EV, T.whiteRise[0], T.whiteRise[1], p => $('eWhite').style.opacity = p, ease.in2);

    anim(eCard, [{ transform: 'translateY(-50%) scale(1.4)' }, { transform: 'translateY(-50%) scale(1.15)' }], 380, { easing: 'cubic-bezier(.2,1.5,.4,1)' });

  tween(EV, T.reveal, 380, (p) => {                                              // 鏡頭震衰減

  });
}

/* ---------- 綁定 ---------- */
$('btnFuse').onclick = playFuse;
$('btnEvo').onclick = playEvo;
$('eDone').onclick = () => {
  $('eDone').classList.remove('on'); fallTimer = 0;
  anim($('evo'), [{ opacity: 1 }, { opacity: 0 }], 260).onfinish = evoClose;
};
// 強化：演出中點畫面任意處 → 跳到結果態（按鈕除外，按鈕=重播/切換）
document.addEventListener('pointerdown', e => {
  if (!fuse.playing || evo.playing) return;
  if (e.target.closest('button')) return;
  fuseFinalState();
});
$('btnSpeed').onclick = () => {
  speed = speed === 1 ? .5 : 1; $('btnSpeed').classList.toggle('on', speed !== 1);
  $('btnSpeed').textContent = speed === 1 ? '慢動作 ×0.5' : '慢動作中（點回 ×1）';
};
// 預載圖（避免進化換圖瞬間閃爍）
['c03_full','c03_e_full','c03_thumb','c03_e_thumb','c61_thumb','c71_thumb'].forEach(n => { const i = new Image(); i.src = 'art/' + n + '.webp'; });
// 初始：結果前的待機態
window.addEventListener('load', () => { layoutScene(); fuseReset(); });
document.fonts && document.fonts.ready.then(layoutScene);
layoutScene(); fuseReset();
</script>
</body>
</html>
